
version: '2.1'

orbs:
  python: circleci/python@4.0.0

workflows:
  main:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/

jobs:
  build:
    docker:
      - image: cimg/python:3.13-browsers
    executor: python/default
    steps:
      - checkout:
          method: full
      - restore_cache:
          key: &deps1-cache deps1-{{ .Branch }}-{{ checksum "setup.py" }}
      - run:
          name: Install library dependencies
          command: |
            echo "***************************************************"
            uname -a
            sudo apt update
            sudo apt-get update
            sudo apt install libnotify-dev
            sudo apt install libgtk-3-dev
            sudo apt install libjpeg-dev
            sudo apt install libpng-dev
            sudo apt install libtiff-dev
            sudo apt-get install -y  libsdl2-dev
            echo "***************************************************"
            pip install --upgrade pip
            pip install setuptools==70.3.0
            pip install twine
            pip install wheel
            pip install html-testRunner==1.2.1
            pip install six==1.17.0
            pip install attrdict3
            pip install https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-24.04/wxpython-4.2.5-cp313-cp313-linux_x86_64.whl
            pip install -r requirements.txt
      - save_cache:
          key: *deps1-cache
          paths:
            - "venv"
      - run:
            name: run tests
            command: | 
              . venv/bin/activate
              unittests
