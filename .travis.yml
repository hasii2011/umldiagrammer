    on_success: change # default: change
    on_failure: always # default: always

language: python

dist: noble

cache: pip

services:
  - xvfb

python:
  - "3.13"

install:
  - echo '***************************************************************'
  - sudo apt update
  - sudo apt install libnotify-dev
  - sudo apt install libgtk-3-dev
  - sudo apt install libtiff-dev
  - sudo apt-get install -y  libsdl2-dev
  - echo '***************************************************************'
  - pip install --upgrade pip
  - pip install setuptools==70.3.0
  - pip install twine
  - pip install wheel
  - pip install Cython
  - pip install six==1.17.0
  - pip install attrdict3==2.0.2
  - travis_wait pip install -vvv --no-build-isolation wxPython==4.2.5
  - pip install semantic-version==2.10.0
  - pip install codeallybasic==1.30.1
  - pip install umlmodel==3.4.1
  - pip install untangle==1.2.1
  - pip install codeallyadvanced==2.5.5
  - pip install umlshapes==2.3.8
  - pip install umlio==0.7.1
  - pip install umlextensions==0.9.1

# command to run tests
script:
  - pip install buildlackey
  - unittests -v loud
